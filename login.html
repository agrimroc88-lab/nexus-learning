<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ingresar · Nexus Learning</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="fondo-login">

  <main class="caja-login">
    <a class="marca marca-oscura" href="index.html" aria-label="Nexus Learning, inicio">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="8" cy="15" r="6" fill="#E3B341"/>
        <circle cx="22" cy="15" r="6" fill="none" stroke="#E3B341" stroke-width="3"/>
        <rect x="12" y="13.5" width="6" height="3" fill="#E3B341"/>
      </svg>
      Nexus Learning
    </a>

    <h1 id="login-titulo">Equipo de capacitación</h1>
    <p class="intro" id="login-intro">Para administradores y docentes. Si trabajas en NEXUS, entra con tu cédula y tu contraseña de NEXUS.</p>

    <div id="mensaje" class="aviso" role="alert" hidden></div>

    <form id="form-login" novalidate>
      <label class="etiqueta" for="correo">Cédula o correo electrónico</label>
      <input class="campo" id="correo" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>

      <label class="etiqueta" for="clave">Contraseña</label>
      <input class="campo" id="clave" type="password" autocomplete="current-password" required>

      <button class="boton boton-ancho" type="submit" id="btn-ingresar">Ingresar</button>
    </form>

    <p class="nota-login">¿Olvidaste tu contraseña? Pide al administrador de la plataforma que la restablezca.</p>
    <p class="nota-login"><a data-nexus="" href="#">Ir a NEXUS · Seguridad y Salud Ocupacional</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

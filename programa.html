<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programa de capacitación · Nexus Learning</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Estilos: generales + los de la página del curso -->
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/curso.css">
</head>
<body class="fondo-zona">

  <!-- ===== Barra superior ===== -->
  <header class="barra">
    <div class="contenedor">
      <a class="marca" href="index.html" aria-label="Nexus Learning, inicio">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
          <circle cx="8" cy="15" r="6" fill="#F2C14E"/>
          <circle cx="22" cy="15" r="6" fill="none" stroke="#F2C14E" stroke-width="3"/>
          <rect x="12" y="13.5" width="6" height="3" fill="#F2C14E"/>
        </svg>
        Nexus Learning
      </a>
      <nav>
        <a href="verificar.html">Verificar certificado</a>
      </nav>
    </div>
  </header>

  <main class="contenedor pagina-curso">
    <div id="estado" class="aviso" role="status">Cargando programa…</div>

    <div id="programa" hidden>
      <div class="curso-cabecera">
        <div class="cabecera-portada" id="p-portada" aria-hidden="true"></div>
        <div class="cabecera-texto">
          <p class="empresa-etiqueta">Programa de capacitación</p>
          <h1 id="p-titulo"></h1>
          <p id="p-datos"></p>
        </div>
      </div>

      <section class="vista vista-angosta">
        <p class="nota-intro" id="p-descripcion"></p>

        <form id="form-clave" class="bloque-form" novalidate>
          <label class="etiqueta" for="clave">Clave de acceso que te dio tu empresa</label>
          <div class="fila-boton">
            <input class="campo campo-codigo" id="clave" placeholder="AGR48213" maxlength="14"
                   autocomplete="off" autocapitalize="characters" spellcheck="false">
            <button class="boton" type="submit" id="btn-clave">Ingresar</button>
          </div>
          <p class="error-campo" id="error-clave" role="alert"></p>
        </form>
      </section>
    </div>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <span>Nexus Learning, de VitalWork S.A.S.</span>
      <a href="verificar.html">Verificar un certificado</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/programa.js"></script>
</body>
</html>

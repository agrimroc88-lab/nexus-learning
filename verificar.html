<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificar certificado · Nexus Learning</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="Comprueba si un certificado de Nexus Learning es auténtico.">

  <!-- Fuentes -->
  <link rel="preconnect" href="https://yfmefiytswvxsqmnmrvg.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Estilos: generales + propios de esta página -->
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/verificar.css">
</head>
<body>

  <!-- ===== Barra superior ===== -->
  <header class="barra">
    <div class="contenedor">
      <a class="marca" href="index.html" aria-label="Nexus Learning, inicio">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
          <circle cx="8" cy="15" r="6" fill="#E3B341"/>
          <circle cx="22" cy="15" r="6" fill="none" stroke="#E3B341" stroke-width="3"/>
          <rect x="12" y="13.5" width="6" height="3" fill="#E3B341"/>
        </svg>
        Nexus Learning
      </a>
      <nav>
        <a href="index.html#cursos">Cursos</a>
      </nav>
    </div>
  </header>

  <main class="contenedor pagina-verificar">
    <h1>Verificar un certificado</h1>
    <p class="intro">Escribe el código que aparece en el certificado, debajo del código QR.</p>

    <form id="form-verificar" class="buscador" novalidate>
      <label for="codigo" class="etiqueta">Código del certificado</label>
      <div class="buscador-fila">
        <input id="codigo" name="codigo" class="campo" placeholder="VW-2026-A1B2C3D4" maxlength="20" autocapitalize="characters" autocomplete="off" spellcheck="false">
        <button class="boton" type="submit" id="btn-verificar">Verificar</button>
      </div>
      <p class="error-campo" id="error-codigo" role="alert"></p>
    </form>

    <div id="resultado" aria-live="polite"></div>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <span>Nexus Learning, de VitalWork S.A.S.</span>
      <a href="index.html">Ir al inicio</a>
    </div>
  </footer>

  <!-- Scripts: el orden importa -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/verificar.js?v=2"></script>
</body>
</html>
